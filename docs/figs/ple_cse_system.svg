<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 600" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#000"/>
    </marker>
  </defs>
  <rect width="1240" height="600" fill="#fff"/>

  <!-- Host CPU -->
  <rect x="10" y="190" width="90" height="90" fill="#fff" stroke="#000" stroke-width="1.5"/>
  <text x="55" y="230" text-anchor="middle" font-size="16" font-weight="bold">Host</text>
  <text x="55" y="250" text-anchor="middle" font-size="16" font-weight="bold">CPU</text>
  <!-- PLE container -->
  <rect x="140" y="20" width="620" height="460" fill="#dbe8fb" stroke="#6c8ebf" stroke-width="1.5"/>
  <text x="160" y="52" font-size="24" font-weight="bold">PLE</text>

  <line x1="160" y1="210" x2="100" y2="210" stroke="#000" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="130" y="203" text-anchor="middle" font-size="12">irq</text>
  <line x1="100" y1="260" x2="160" y2="260" stroke="#000" stroke-width="1.5" marker-start="url(#a)" marker-end="url(#a)"/>
  <text x="130" y="253" text-anchor="middle" font-size="12">AXI-Lite</text>

  <!-- HIF -->
  <rect x="160" y="90" width="80" height="300" fill="#fff" stroke="#000" stroke-width="1.5"/>
  <text x="200" y="235" text-anchor="middle" font-size="16" font-weight="bold">HIF</text>
  <text x="200" y="254" text-anchor="middle" font-size="12">regs, IRQ</text>

  <!-- Controller -->
  <rect x="270" y="90" width="120" height="300" fill="#fff" stroke="#000" stroke-width="1.5"/>
  <text x="330" y="225" text-anchor="middle" font-size="16" font-weight="bold">Controller</text>
  <text x="330" y="244" text-anchor="middle" font-size="12">RRT-Connect FSM</text>
  <text x="330" y="260" text-anchor="middle" font-size="12">path buffer</text>
  <line x1="240" y1="240" x2="270" y2="240" stroke="#000" stroke-width="1.5" marker-start="url(#a)" marker-end="url(#a)"/>

  <!-- Datapath units -->
  <g stroke="#000" stroke-width="1.5" fill="#fff">
    <rect x="420" y="90" width="130" height="48"/>
    <rect x="420" y="153" width="130" height="48"/>
    <rect x="420" y="216" width="130" height="48"/>
    <rect x="420" y="279" width="130" height="48"/>
    <rect x="420" y="342" width="130" height="48"/>
  </g>
  <g text-anchor="middle">
    <text x="485" y="111" font-size="15" font-weight="bold">SMP</text><text x="485" y="128" font-size="12">Halton sampler</text>
    <text x="485" y="174" font-size="15" font-weight="bold">TREE</text><text x="485" y="191" font-size="12">2 trees, BRAM</text>
    <text x="485" y="237" font-size="15" font-weight="bold">NNU</text><text x="485" y="254" font-size="12">nearest, 4 lanes</text>
    <text x="485" y="300" font-size="15" font-weight="bold">ISQRT</text><text x="485" y="317" font-size="12">integer sqrt</text>
    <text x="485" y="363" font-size="15" font-weight="bold">DIV7</text><text x="485" y="380" font-size="12">7-lane divider</text>
  </g>
  <g stroke="#000" stroke-width="1.5" marker-start="url(#a)" marker-end="url(#a)">
    <line x1="390" y1="114" x2="420" y2="114"/>
    <line x1="390" y1="177" x2="420" y2="177"/>
    <line x1="390" y1="240" x2="420" y2="240"/>
    <line x1="390" y1="303" x2="420" y2="303"/>
    <line x1="390" y1="366" x2="420" y2="366"/>
  </g>

  <!-- Controller <-> EVU, routed above the units -->
  <polyline points="330,90 330,70 665,70 665,90" fill="none" stroke="#000" stroke-width="1.5" marker-start="url(#a)" marker-end="url(#a)"/>
  <text x="497" y="64" text-anchor="middle" font-size="12">edge start / ok</text>

  <!-- EVU -->
  <rect x="580" y="90" width="170" height="300" fill="#fff2cc" stroke="#d6b656" stroke-width="1.5"/>
  <text x="665" y="112" text-anchor="middle" font-size="15" font-weight="bold">EVU</text>
  <g stroke="#000" stroke-width="1.5" fill="#fff">
    <rect x="595" y="125" width="140" height="44"/>
    <rect x="595" y="190" width="140" height="44"/>
    <rect x="595" y="270" width="62" height="56"/>
    <rect x="673" y="270" width="62" height="56"/>
  </g>
  <g text-anchor="middle">
    <text x="665" y="145" font-size="15" font-weight="bold">RKG</text><text x="665" y="161" font-size="12">edge poses</text>
    <text x="665" y="210" font-size="15" font-weight="bold">FKU</text><text x="665" y="226" font-size="12">70 sphere centres</text>
    <text x="626" y="294" font-size="15" font-weight="bold">SCU</text><text x="626" y="311" font-size="12">self</text>
    <text x="704" y="294" font-size="15" font-weight="bold">QD</text><text x="704" y="311" font-size="12">queries</text>
  </g>
  <g stroke="#000" stroke-width="1.5" fill="none" marker-end="url(#a)">
    <line x1="665" y1="169" x2="665" y2="190"/>
    <polyline points="665,234 665,252 626,252 626,270"/>
    <polyline points="665,252 704,252 704,270"/>
  </g>

  <!-- CSE container -->
  <rect x="815" y="20" width="415" height="460" fill="#e6e6e6" stroke="#666" stroke-width="1.5"/>
  <text x="1150" y="50" text-anchor="middle" font-size="24" font-weight="bold">CSE</text>

  <!-- Q / K / R lanes between QD and CSE -->
  <g stroke="#000" stroke-width="1.5" fill="none">
    <polyline points="735,284 772,284 772,48 1000,48 1000,72" marker-end="url(#a)"/>
    <polyline points="735,298 786,298 786,190 830,190" marker-end="url(#a)"/>
    <polyline points="1000,428 1000,450 800,450 800,312 735,312" marker-end="url(#a)"/>
  </g>
  <g font-size="14" font-weight="bold" text-anchor="middle">
    <rect x="762" y="140" width="20" height="18" fill="#fff"/><text x="772" y="154">Q</text>
    <rect x="776" y="226" width="20" height="18" fill="#fff"/><text x="786" y="240">K</text>
    <rect x="790" y="370" width="20" height="18" fill="#fff"/><text x="800" y="384">R</text>
  </g>

  <!-- kill generation -->
  <rect x="830" y="150" width="80" height="120" fill="#fff" stroke="#000" stroke-width="1.5"/>
  <text x="870" y="203" text-anchor="middle" font-size="15" font-weight="bold">Kill</text>
  <text x="870" y="221" text-anchor="middle" font-size="12">generation</text>
  <g stroke="#000" stroke-width="1.5" stroke-dasharray="5 3" fill="none" marker-end="url(#a)">
    <polyline points="910,175 925,175 925,90 920,90"/>
    <line x1="910" y1="210" x2="920" y2="210"/>
    <line x1="910" y1="250" x2="920" y2="250"/>
  </g>

  <!-- query path -->
  <g stroke="#000" stroke-width="1.5" fill="#fff">
    <rect x="920" y="72" width="160" height="38"/>
    <rect x="920" y="132" width="160" height="38"/>
    <rect x="920" y="352" width="160" height="38"/>
    <rect x="920" y="390" width="160" height="38"/>
  </g>
  <g text-anchor="middle" font-size="15" font-weight="bold">
    <text x="1000" y="96">Input FIFO</text>
    <text x="1000" y="156">Dispatcher</text>
    <text x="1000" y="376">Receiver</text>
    <text x="1000" y="414">Response FIFO</text>
  </g>
  <line x1="1000" y1="110" x2="1000" y2="132" stroke="#000" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- CU array -->
  <rect x="920" y="190" width="160" height="110" fill="#fff2cc" stroke="#d6b656" stroke-width="1.5"/>
  <rect x="932" y="205" width="64" height="80" fill="#3a3a3a" stroke="#000" stroke-width="1.5"/>
  <rect x="1004" y="205" width="64" height="80" fill="#3a3a3a" stroke="#000" stroke-width="1.5"/>
  <g text-anchor="middle" font-size="15" font-weight="bold" fill="#fff">
    <text x="964" y="250">CU 0</text>
    <text x="1036" y="250">CU 1</text>
  </g>
  <g stroke="#000" stroke-width="1.5" marker-end="url(#a)">
    <line x1="964" y1="170" x2="964" y2="205"/>
    <line x1="1036" y1="170" x2="1036" y2="205"/>
    <line x1="964" y1="285" x2="964" y2="352"/>
    <line x1="1036" y1="285" x2="1036" y2="352"/>
  </g>
  <!-- cancelled queries bypass the CUs -->
  <polyline points="1080,151 1100,151 1100,371 1080,371" fill="none" stroke="#000" stroke-width="1.5" stroke-dasharray="5 3" marker-end="url(#a)"/>
  <text x="1106" y="330" font-size="12">KILLED</text>

  <!-- environment memory -->
  <rect x="860" y="520" width="340" height="60" fill="#fff" stroke="#000" stroke-width="1.5"/>
  <text x="1030" y="546" text-anchor="middle" font-size="15" font-weight="bold">Environment memory</text>
  <text x="1030" y="565" text-anchor="middle" font-size="12">HDR · DIR · CELL · PTS, 2 buffers</text>
  <polyline points="1080,245 1180,245 1180,520" fill="none" stroke="#000" stroke-width="1.5" marker-start="url(#a)" marker-end="url(#a)"/>
  <text x="1172" y="505" text-anchor="end" font-size="12">read ports × N_CU</text>
  <line x1="700" y1="550" x2="860" y2="550" stroke="#000" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="780" y="543" text-anchor="middle" font-size="12">env write</text>
</svg>
