<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#000"/>
    </marker>
  </defs>
  <rect width="960" height="640" fill="#fff"/>

  <!-- Host CPU -->
  <rect x="5" y="140" width="85" height="80" fill="#fff" stroke="#000" stroke-width="1.5"/>
  <text x="47" y="176" text-anchor="middle" font-size="14" font-weight="bold">Host</text>
  <text x="47" y="194" text-anchor="middle" font-size="14" font-weight="bold">CPU</text>
  <line x1="160" y1="160" x2="90" y2="160" stroke="#000" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="125" y="153" text-anchor="middle" font-size="11">irq</text>
  <line x1="90" y1="200" x2="160" y2="200" stroke="#000" stroke-width="1.5" marker-start="url(#a)" marker-end="url(#a)"/>
  <text x="125" y="193" text-anchor="middle" font-size="10">AXI-Lite</text>

  <!-- PLE container -->
  <rect x="140" y="20" width="800" height="470" fill="#dbe8fb" stroke="#6c8ebf" stroke-width="1.5"/>
  <text x="540" y="52" text-anchor="middle" font-size="24" font-weight="bold">PLE</text>

  <!-- HIF -->
  <rect x="160" y="95" width="100" height="270" fill="#fff" stroke="#000" stroke-width="1.5"/>
  <text x="210" y="225" text-anchor="middle" font-size="15" font-weight="bold">HIF</text>
  <text x="210" y="244" text-anchor="middle" font-size="10">AXI-Lite slave</text>
  <text x="210" y="258" text-anchor="middle" font-size="10">cfg regs, IRQ</text>

  <!-- Controller -->
  <rect x="300" y="95" width="120" height="270" fill="#fff" stroke="#000" stroke-width="1.5"/>
  <text x="360" y="215" text-anchor="middle" font-size="15" font-weight="bold">Controller</text>
  <text x="360" y="234" text-anchor="middle" font-size="10">RRT-Connect FSM</text>
  <text x="360" y="248" text-anchor="middle" font-size="10">(ple_core)</text>
  <line x1="260" y1="230" x2="300" y2="230" stroke="#000" stroke-width="1.5" marker-start="url(#a)" marker-end="url(#a)"/>
  <rect x="300" y="390" width="120" height="60" fill="#fff" stroke="#000" stroke-width="1.5"/>
  <text x="360" y="416" text-anchor="middle" font-size="13" font-weight="bold">PBT</text>
  <text x="360" y="434" text-anchor="middle" font-size="11">path backtrace + buffer</text>
  <line x1="360" y1="365" x2="360" y2="390" stroke="#000" stroke-width="1.5" marker-start="url(#a)" marker-end="url(#a)"/>

  <!-- Datapath units -->
  <g stroke="#000" stroke-width="1.5" fill="#fff">
    <rect x="460" y="95" width="130" height="40"/>
    <rect x="460" y="152" width="130" height="40"/>
    <rect x="460" y="209" width="130" height="40"/>
    <rect x="460" y="266" width="130" height="40"/>
    <rect x="460" y="323" width="130" height="40"/>
  </g>
  <g text-anchor="middle">
    <text x="525" y="112" font-size="14" font-weight="bold">SMP</text><text x="525" y="126" font-size="10">Halton sampler</text>
    <text x="525" y="169" font-size="14" font-weight="bold">TREE</text><text x="525" y="183" font-size="10">start / goal node mem</text>
    <text x="525" y="226" font-size="14" font-weight="bold">NNU</text><text x="525" y="240" font-size="10">nearest neighbour</text>
    <text x="525" y="283" font-size="14" font-weight="bold">ISQRT</text><text x="525" y="297" font-size="10">integer sqrt</text>
    <text x="525" y="340" font-size="14" font-weight="bold">DIV7</text><text x="525" y="354" font-size="10">7-lane divider</text>
  </g>
  <g stroke="#000" stroke-width="1.5" marker-start="url(#a)" marker-end="url(#a)">
    <line x1="420" y1="115" x2="460" y2="115"/>
    <line x1="420" y1="172" x2="460" y2="172"/>
    <line x1="420" y1="229" x2="460" y2="229"/>
    <line x1="420" y1="286" x2="460" y2="286"/>
    <line x1="420" y1="343" x2="460" y2="343"/>
  </g>

  <!-- Controller <-> EVU command bus, routed above the units -->
  <polyline points="360,95 360,70 780,70 780,95" fill="none" stroke="#000" stroke-width="1.5" marker-start="url(#a)" marker-end="url(#a)"/>
  <text x="570" y="64" text-anchor="middle" font-size="10">start, vec, len_h / done, edge_ok</text>

  <!-- EVU (yellow, like the lane group) -->
  <rect x="640" y="95" width="280" height="270" fill="#fff2cc" stroke="#d6b656" stroke-width="1.5"/>
  <text x="780" y="117" text-anchor="middle" font-size="14" font-weight="bold">EVU (edge validation)</text>
  <g stroke="#000" stroke-width="1.5" fill="#fff">
    <rect x="670" y="130" width="220" height="40"/>
    <rect x="670" y="195" width="220" height="40"/>
    <rect x="670" y="270" width="100" height="50"/>
    <rect x="790" y="270" width="100" height="50"/>
  </g>
  <g text-anchor="middle">
    <text x="780" y="147" font-size="14" font-weight="bold">RKG</text><text x="780" y="161" font-size="10">pose (rake) generator</text>
    <text x="780" y="212" font-size="14" font-weight="bold">FKU</text><text x="780" y="226" font-size="10">forward kinematics, 70 sphere centres</text>
    <text x="720" y="290" font-size="14" font-weight="bold">SCU</text><text x="720" y="306" font-size="10">self collision</text>
    <text x="840" y="290" font-size="14" font-weight="bold">QD</text><text x="840" y="306" font-size="10">env. queries</text>
  </g>
  <g stroke="#000" stroke-width="1.5" fill="none" marker-end="url(#a)">
    <line x1="780" y1="170" x2="780" y2="195"/>
    <polyline points="780,235 780,252 720,252 720,270"/>
    <polyline points="780,252 840,252 840,270"/>
  </g>

  <!-- Q / R / K between QD and CSE -->
  <g stroke="#000" stroke-width="1.5">
    <line x1="805" y1="320" x2="805" y2="520" marker-end="url(#a)"/>
    <line x1="840" y1="520" x2="840" y2="320" marker-end="url(#a)"/>
    <line x1="875" y1="320" x2="875" y2="520" marker-end="url(#a)"/>
  </g>
  <g font-size="13" font-weight="bold" text-anchor="middle">
    <rect x="795" y="395" width="20" height="18" fill="#dbe8fb" stroke="none"/><text x="805" y="409">Q</text>
    <rect x="830" y="395" width="20" height="18" fill="#dbe8fb" stroke="none"/><text x="840" y="409">R</text>
    <rect x="865" y="395" width="20" height="18" fill="#dbe8fb" stroke="none"/><text x="875" y="409">K</text>
  </g>

  <!-- N CSE instances on a shared Q/R/K bus -->
  <line x1="682" y1="520" x2="878" y2="520" stroke="#000" stroke-width="1.5"/>
  <g stroke="#000" stroke-width="1.5" marker-start="url(#a)" marker-end="url(#a)">
    <line x1="682" y1="520" x2="682" y2="550"/>
    <line x1="780" y1="520" x2="780" y2="550"/>
    <line x1="878" y1="520" x2="878" y2="550"/>
  </g>
  <rect x="640" y="550" width="85" height="60" fill="#3a3a3a" stroke="#000" stroke-width="1.5"/>
  <rect x="737" y="550" width="85" height="60" fill="#3a3a3a" stroke="#000" stroke-width="1.5" stroke-dasharray="5 3"/>
  <rect x="835" y="550" width="85" height="60" fill="#3a3a3a" stroke="#000" stroke-width="1.5"/>
  <g text-anchor="middle" font-size="16" font-weight="bold" fill="#fff">
    <text x="682" y="586">CSE 0</text>
    <text x="780" y="588" font-size="20">…</text>
    <text x="878" y="586">CSE N-1</text>
  </g>
</svg>
